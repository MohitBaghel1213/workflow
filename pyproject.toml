[project]
name = "framework-independent-declarative-workflow"
version = "0.1.0"
description = "Framework-independent declarative workflow engine with pluggable runtimes."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]
langchain = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]
claude = [
    "claude-agent-sdk>=0.2.90",
]
all = [
    "pytest>=8.0,<9.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "claude-agent-sdk>=0.2.90",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
