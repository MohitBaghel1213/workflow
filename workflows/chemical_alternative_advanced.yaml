api_version: "1.0"
workflow:
  id: chemical-alternative-advanced
  name: Chemical Alternative — Advanced
  version: "2.0.0"
  description: Same reusable property-collection sub-workflow with a seven-property profile.
  input:
    schema:
      type: object
      required: [user_prompt]
      properties:
        user_prompt:
          type: string
          min_length: 1
  state:
    property_collection_result:
      type: object
      default: {}
    execution:
      type: object
      default: {total_steps: 0}
    chemical_alternative_result:
      type: object
      default: {}
  policies:
    execution_limits:
      max_total_steps: 20
  capabilities:
    allowed: [find_chemical_alternatives]
    # Business capability IDs map to reusable implementation IDs. Add another
    # agent by adding a definition here; no new execute() method is needed.
    definitions:
      find_chemical_alternatives:
        implementation: agent
        required_inputs: [properties]
        config:
          instructions: |
            Find possible chemical alternatives using the confirmed product requirements.
            Use the available tools to search for candidates and compare them against the
            supplied requirements. Do not claim certified equivalence. Clearly identify
            uncertainty and recommend domain validation before real-world substitution.
          tools:
            - chemical_database_search
            - compare_chemical_candidates
          max_iterations: 5
  steps:
    - id: collect_properties
      name: Collect and Confirm Properties
      type: workflow
      workflow: property-collection
      input:
        user_prompt: "${input.user_prompt}"
        property_profile: "${profiles.chemical_advanced}"
      output:
        target: state.property_collection_result
      on_success:
        next: find_chemical_alternatives
      on_failure:
        next: handle_failure
    - id: find_chemical_alternatives
      name: Find Chemical Alternatives Using Agent Tool Calling
      type: capability
      capability: find_chemical_alternatives
      input:
        properties: "${state.property_collection_result.properties}"
      output:
        target: state.chemical_alternative_result
      on_success:
        next: complete_workflow
      on_failure:
        next: handle_failure
    - id: complete_workflow
      name: Return Properties and Chemical Alternatives
      type: terminal
      status: COMPLETED
      output:
        result: "${state.property_collection_result}"
        alternatives: "${state.chemical_alternative_result}"
    - id: handle_failure
      name: Handle Child Workflow Failure
      type: terminal
      status: FAILED
      output:
        error: "${error}"
